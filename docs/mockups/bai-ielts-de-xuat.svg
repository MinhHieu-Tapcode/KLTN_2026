 <rect x="22" y="15" width="118" height="28" rx="7" fill="#EA580C"/><path d="M35 23h10v12H35zM38 20h4v3" stroke="#fff" stroke-width="1.3"/><text x="52" y="33" font-size="12" font-weight="750" fill="#fff">IELTS READING</text>
 <text x="159" y="35" font-size="14" font-weight="700" fill="#F1F5F9">Đề thi IELTS Cambridge 18 · Full Test 01</text>
 <rect x="1041" y="13" width="138" height="32" rx="16" fill="#1E293B" stroke="#334155"/><circle cx="1060" cy="29" r="5" fill="#FBBF24"/><text x="1074" y="34" font-size="14" font-weight="750" fill="#FCD34D">32:18</text><text x="1123" y="33" font-size="10" fill="#94A3B8">còn lại</text>
 <rect x="1195" y="13" width="142" height="32" rx="9" fill="#EA580C"/><path d="M1212 24h11v10h-11zM1215 21h5v3" stroke="#fff" stroke-width="1.3"/><text x="1229" y="33" font-size="12" font-weight="750" fill="#fff">Nộp bài thi</text><rect x="1352" y="14" width="31" height="30" rx="8" fill="#1E293B"/><path d="m1362 24 10 10m0-10-10 10" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
 <rect x="0" y="58" width="720" height="902" fill="#fff"/><rect x="720" y="58" width="720" height="902" fill="#F8FAFC"/><path d="M720 58V960" stroke="#E2E8F0"/>
 <!-- Reading pane -->
 <rect x="0" y="58" width="720" height="60" fill="#FFFFFF"/><path d="M24 117H696" stroke="#E2E8F0"/><text x="28" y="94" font-size="12" font-weight="750" letter-spacing=".7" fill="#334155">READING PASSAGE 1</text>
 <rect x="570" y="76" width="32" height="27" rx="6" fill="#0F172A"/><text x="586" y="95" text-anchor="middle" font-size="12" font-weight="750" fill="#fff">A</text><rect x="606" y="76" width="38" height="27" rx="6" fill="#fff" stroke="#CBD5E1"/><text x="625" y="95" text-anchor="middle" font-size="12" font-weight="750" fill="#475569">A+</text>
 <text x="30" y="159" font-size="19" font-weight="800">Part 1 - Reading Passage 1</text><text x="30" y="185" font-size="16" font-weight="750">THE IMPACT OF TECHNOLOGY ON EDUCATION</text><path d="M30 201H690" stroke="#E2E8F0"/>
 <circle cx="44" cy="231" r="13" fill="#F1F5F9" stroke="#E2E8F0"/><text x="44" y="235" text-anchor="middle" font-size="12" font-weight="700">A</text><text x="67" y="235" class="body" fill="#475569">Technology has transformed the way students learn and access</text><text x="67" y="258" class="body" fill="#475569">information. With the rise of online platforms, learners can now</text><text x="67" y="281" class="body" fill="#475569">study at their own pace and from almost anywhere in the world.</text>
 <circle cx="44" cy="326" r="13" fill="#F1F5F9" stroke="#E2E8F0"/><text x="44" y="330" text-anchor="middle" font-size="12" font-weight="700">B</text><text x="67" y="330" class="body" fill="#475569">However, this shift also brings challenges. Many students struggle</text><text x="67" y="353" class="body" fill="#475569">with self-discipline and find it difficult to stay motivated without</text><text x="67" y="376" class="body" fill="#475569">direct supervision.</text>
 <circle cx="44" cy="422" r="13" fill="#F1F5F9" stroke="#E2E8F0"/><text x="44" y="426" text-anchor="middle" font-size="12" font-weight="700">C</text><text x="67" y="426" class="body" fill="#475569">On the other hand, technology also provides teachers with new</text><text x="67" y="449" class="body" fill="#475569">tools to create more engaging and personalized learning</text><text x="67" y="472" class="body" fill="#475569">experiences.</text>
 <rect x="30" y="515" width="660" height="1" fill="#EEF0F3"/><text x="30" y="548" class="tiny muted">Đoạn văn được giữ ở cột trái để người học đối chiếu khi trả lời.</text>
 <!-- Questions pane -->
 <rect x="720" y="58" width="720" height="60" fill="#F8FAFC"/><path d="M744 117H1416" stroke="#E2E8F0"/><text x="748" y="94" font-size="12" font-weight="750" letter-spacing=".7" fill="#334155">QUESTIONS &amp; ANSWER SHEET</text><text x="1410" y="94" text-anchor="end" font-size="12" fill="#64748B">Đã làm <tspan fill="#EA580C" font-weight="750">0</tspan>/3 câu</text>
