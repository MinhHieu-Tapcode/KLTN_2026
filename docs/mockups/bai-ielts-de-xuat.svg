 <rect x="778" y="230" width="604" height="132" rx="12" fill="#FFFBEB" stroke="#FDE68A"/><text x="798" y="256" font-size="11" font-weight="800" letter-spacing=".5" fill="#78350F">LIST OF HEADINGS</text><text x="1360" y="256" text-anchor="end" font-size="10" fill="#B45309">4 tiêu đề</text><path d="M798 266H1360" stroke="#FDE68A"/><text x="800" y="291" font-size="12" font-weight="700" fill="#92400E">i.</text><text x="827" y="291" font-size="12">The benefits of online learning</text><text x="1087" y="291" font-size="12" font-weight="700" fill="#92400E">ii.</text><text x="1115" y="291" font-size="12">Challenges for students</text><text x="800" y="330" font-size="12" font-weight="700" fill="#92400E">iii.</text><text x="827" y="330" font-size="12">The role of teachers</text><text x="1087" y="330" font-size="12" font-weight="700" fill="#92400E">iv.</text><text x="1115" y="330" font-size="12">Technology and the future</text>
 <rect x="778" y="379" width="604" height="58" rx="11" fill="#FFF7ED" stroke="#EA580C"/><rect x="792" y="394" width="24" height="26" rx="7" fill="#EA580C"/><text x="804" y="412" text-anchor="middle" font-size="11" font-weight="750" fill="#fff">1</text><text x="829" y="411" font-size="12" font-weight="750">Paragraph A</text><rect x="1055" y="391" width="306" height="34" rx="8" fill="#fff" stroke="#EA580C"/><text x="1068" y="413" font-size="11" fill="#64748B">-- Choose a heading... --</text><path d="m1339 403 5 5 5-5" stroke="#64748B" stroke-width="1.4"/>
 <rect x="778" y="447" width="604" height="58" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="792" y="462" width="24" height="26" rx="7" fill="#0F172A"/><text x="804" y="480" text-anchor="middle" font-size="11" font-weight="750" fill="#fff">2</text><text x="829" y="479" font-size="12" font-weight="750">Paragraph B</text><rect x="1055" y="459" width="306" height="34" rx="8" fill="#fff" stroke="#CBD5E1"/><text x="1068" y="481" font-size="11" fill="#64748B">-- Choose a heading... --</text><path d="m1339 471 5 5 5-5" stroke="#64748B" stroke-width="1.4"/>
 <rect x="778" y="515" width="604" height="58" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="792" y="530" width="24" height="26" rx="7" fill="#0F172A"/><text x="804" y="548" text-anchor="middle" font-size="11" font-weight="750" fill="#fff">3</text><text x="829" y="547" font-size="12" font-weight="750">Paragraph C</text><rect x="1055" y="527" width="306" height="34" rx="8" fill="#fff" stroke="#CBD5E1"/><text x="1068" y="549" font-size="11" fill="#64748B">-- Choose a heading... --</text><path d="m1339 539 5 5 5-5" stroke="#64748B" stroke-width="1.4"/>
 <text x="748" y="640" class="tiny muted">Bố cục Reading hai cột và thanh thi toàn màn hình theo trình phát hiện tại.</text>
 <text x="22" y="932" class="tiny muted">Mockup đề xuất · Phần hiển thị minh họa, thao tác lưu/nộp bài phụ thuộc luồng hiện có.</text>
