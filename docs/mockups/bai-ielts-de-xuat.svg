<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" fill="none">
 <defs><filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#172033" flood-opacity=".08"/></filter><style>text{font-family:Manrope,'Segoe UI',Arial,sans-serif;fill:#172033}.muted{fill:#64748B}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:14px}.orange{fill:#EA580C}</style></defs>
